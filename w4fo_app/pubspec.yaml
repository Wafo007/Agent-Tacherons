name: w4fo_app
description: "W4FO — Assistant IA personnel de nouvelle génération"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- State management & navigation ---
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # --- Réseau (REST + WebSocket) ---
  dio: ^5.5.0
  web_socket_channel: ^3.0.1

  # --- Stockage sécurisé (tokens JWT) ---
  flutter_secure_storage: ^9.2.2

  # --- Audio (capture micro + lecture streaming) ---
  record: ^5.1.2
  just_audio: ^0.9.40
  path_provider: ^2.1.4

  # --- Utilitaires ---
  intl: ^0.19.0
  equatable: ^2.0.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
