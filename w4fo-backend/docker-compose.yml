version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: w4fo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-w4fo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-w4fo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-w4fo_db}
    ports:
      - "5432:5432"
    volumes:
      - w4fo_pg_data:/var/lib/postgresql/data
      - ./scripts/init_extensions.sql:/docker-entrypoint-initdb.d/init_extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-w4fo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: w4fo-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  w4fo_pg_data:
